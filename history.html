<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Syspect — Scan History</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%231f594c'/%3E%3Cpath d='M7 17h5l3-8 4 15 3-7h3' fill='none' stroke='%23d8f5aa' stroke-width='2.5'/%3E%3C/svg%3E">
<style>@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;650;700&family=Manrope:wght@500;600;650;700;800&display=swap');
:root{--bg:#f5f6f7;--paper:#fff;--ink:#1c2928;--muted:#747f80;--line:#e6eaea;--green:#24594d;--green-hover:#194638;--pale:#eef5ed;--lime:#d8f1b0;--mono:ui-monospace,'Cascadia Code',Consolas,monospace}
*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);font:16px/1.55 'DM Sans',sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;min-height:100vh}a{text-decoration:none;color:inherit}.symbols{position:absolute;width:0;height:0;overflow:hidden}svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}.topbar{height:90px;padding:0 4%;background:var(--paper);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:12px;color:var(--ink);font:800 29px 'Manrope',sans-serif;letter-spacing:-1.4px}.brand-icon{width:36px;height:36px;display:grid;place-items:center;background:var(--green);border-radius:10px;color:var(--lime)}.brand-icon svg{width:24px;height:24px;stroke-width:2}.brand-divider{width:1px;height:20px;background:#dce0df;margin:0 9px}.brand-caption{font:600 11px 'DM Sans',sans-serif;letter-spacing:1.6px;color:#87908f}.top-right{display:flex;align-items:center;gap:12px}.version{font:12px var(--mono);color:#8a9392;letter-spacing:.8px;margin-right:6px}main{max-width:1180px;margin:0 auto;padding:42px 4% 64px}.page-heading{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin-bottom:28px}.eyebrow{font-size:11px;letter-spacing:1.7px;font-weight:700;color:#87918e}h1{font:700 clamp(30px,4vw,44px)/1.2 'Manrope',sans-serif;letter-spacing:-1.8px;margin:7px 0 10px}.page-heading p{color:var(--muted);font-size:15px;max-width:620px}.button{border:0;border-radius:8px;padding:11px 16px;display:inline-flex;align-items:center;gap:9px;font-size:14px;font-weight:650;background:var(--green);color:#fff;transition:transform .2s,background .2s}.button:hover{transform:translateY(-1px);background:var(--green-hover)}.profile-hero{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:26px;display:flex;align-items:center;gap:18px;margin-bottom:18px}.profile-avatar{width:66px;height:66px;border-radius:18px;background:var(--pale);color:var(--green);display:grid;place-items:center;border:1px solid var(--line)}.profile-avatar svg{width:31px;height:31px}.profile-meta h2{font:700 22px 'Manrope',sans-serif;letter-spacing:-.6px}.profile-meta p{color:var(--muted);font-size:14px;margin-top:3px}.profile-status{margin-left:auto;padding:6px 10px;border-radius:999px;background:var(--pale);color:var(--green);font-size:11px;font-weight:700;letter-spacing:.8px}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:18px}.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:24px}.card-head{margin-bottom:18px}.card-head span{font-size:10px;letter-spacing:1.5px;font-weight:700;color:#87918e}.card-head h3{font:650 18px 'Manrope',sans-serif;margin-top:4px}.info-list{display:grid;grid-template-columns:1fr 1fr;gap:12px}.info-item{border:1px solid var(--line);border-radius:11px;padding:15px;background:color-mix(in srgb,var(--paper) 92%,var(--bg))}.info-item span{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}.info-item strong{font:650 14px 'Manrope',sans-serif}.pref-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}.pref-row:first-of-type{padding-top:3px}.pref-row:last-child{border-bottom:0;padding-bottom:0}.pref-row strong{font-size:14px}.pref-row span{font-size:12px;color:var(--muted);text-align:right}.note{margin-top:18px;padding:14px 16px;border-radius:11px;background:var(--pale);color:var(--muted);font-size:13px;border:1px solid var(--line)}
@media(max-width:820px){.grid{grid-template-columns:1fr}.page-heading{align-items:flex-start;flex-direction:column}.profile-status{display:none}}@media(max-width:650px){.topbar{height:72px}.brand-caption,.brand-divider,.version{display:none}.brand{font-size:25px}.info-list{grid-template-columns:1fr}.profile-hero{padding:20px}.profile-avatar{width:56px;height:56px;border-radius:15px}}
</style>
<link rel="stylesheet" href="theme.css">
<script src="theme.js"></script>
<script src="i18n.js"></script>
<link rel="stylesheet" href="account.css">
<script src="account.js"></script>
</head>
<body>
<svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
<symbol id="pulse" viewBox="0 0 24 24"><path d="M2 13h5l3-9 4 16 3-7h5"/></symbol>
<symbol id="user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c.7-4 3.2-6 7-6s6.3 2 7 6"/></symbol>
<symbol id="arrow" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></symbol>
</defs></svg>
<header class="topbar">
  <a class="brand" href="index.html"><span class="brand-icon"><svg><use href="#pulse"/></svg></span>syspect<span class="brand-divider"></span><span class="brand-caption">PC DIAGNOSTIC ENGINE</span></a>
  <div class="top-right"><span class="version">WORKSPACE / 01</span></div>
</header>
<main>
  <div class="page-heading">
    <div><div class="eyebrow">SAVED REPORTS</div><h1>Scan history.</h1><p>Your diagnostic reports, saved on this computer.</p></div>
    <a class="button" href="dashboard.html">Back to Dashboard <svg><use href="#arrow"/></svg></a>
  </div>
  <section class="account-card" translate="no"><div id="scan-history" aria-live="polite">Loading…</div></section><section id="scan-detail" class="account-card" translate="no" hidden></section>
</main>
</body>
</html>
